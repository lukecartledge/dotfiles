# omp (oh-my-pi) global settings — linked to ~/.omp/agent/config.yml
#
# Uses GitHub Copilot, vault skills, and custom agents. `omp config list` shows every key.

# Model tiers are independent of OpenCode's ~/.omo/omo.jsonc:
#   gpt-6-luna     session default, custom agents and lightweight lanes
#   gpt-5.6-terra planning and deep reasoning
modelRoles:
  default: github-copilot/gpt-6-luna
  smol: github-copilot/gpt-6-luna
  slow: github-copilot/gpt-5.6-terra
  plan: github-copilot/gpt-5.6-terra

# Custom agents are shared with Claude Code (home/claude/agents), whose
# frontmatter names Claude models. Pin them to the opencode tiers instead.
task:
  agentModelOverrides:
    planner: "@default"
    architect: "@default"
    code-reviewer: "@default"
    security-reviewer: "@default"
    tdd-guide: "@default"
    build-error-resolver: "@default"
    e2e-runner: "@default"
    doc-updater: "@default"
    refactor-cleaner: "@default"
    database-reviewer: "@default"

# Vault skills (~/notes/brain/40-skills), one level deep like opencode's
# skills/custom and skills/gathered links.
skills:
  customDirectories:
    - ~/notes/brain/40-skills/custom
    - ~/notes/brain/40-skills/gathered

# UI and session preferences, as written by `omp` setup (setupVersion 2).
symbolPreset: unicode
composer:
  shape: box
theme:
  dark: titanium
setupVersion: 2
extendedContext: true
