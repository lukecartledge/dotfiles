# Sane TMUX Settings

# Better prefix key settings
unbind C-b
set -g prefix C-s
bind-key -r C-s send-prefix

# Reload .tmux.conf
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Select panes more like VIM
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# Make colors a little better
set -ga terminal-overrides ",xterm-256color:Tc"

# Change command edit mode to simpler emacs mode
set-option -g status-keys 'emacs'

# Status bar is rendered by tmuxship (a starship adapter). Colours and segments
# live in home/tmux/tmuxship.toml, not here.
#
# This uses tmuxship's runtime renderer rather than `tmuxship apply`. apply
# builds native tmux options from a module's `style` key only, which cannot
# express a rounded pill (two cap glyphs plus per-segment colours), so it would
# silently drop status-left and the window list.
set-option -g status on
set-option -g status-justify centre
set-option -g status-left-length 100
set-option -g status-right-length 200
set-option -g status-interval 60
# bg=default keeps the bar the terminal's own colour, so the pills float
# rather than sitting on a band of a third, almost-matching dark.
set-option -g status-style "bg=default,fg=#cdd6f4"
# Reset every style the old config and tmux-themepack used to set. Deleting a
# line here does NOT unset it on a server that is already running, and each of
# these defeats the pills in its own way: status-bg/-fg override status-style,
# while the per-area styles are what tmux resolves "default" against inside
# #[push-default] — so a leftover bg=colour233 paints a black notch behind
# every cap rather than letting the terminal show through.
set-option -g status-bg default
set-option -g status-fg default
set-option -g status-left-style default
set-option -g status-right-style default
set-option -g window-status-current-style default
set-option -g window-status-activity-style default
set-option -g window-status-bell-style default
set-option -g window-status-style "bg=default,fg=default"
set-option -g window-status-separator " "
set-option -g focus-events on

setenv -g TMUX_SHIP_CONFIG "$HOME/.config/tmux/tmuxship.toml"

set-option -g status-left  '#(tmuxship left)'
set-option -g status-right '#(tmuxship right)'

# TMUX_SHIP_TARGET pins the render to the window being drawn rather than the
# active one — without it every tab renders as the current window.
set-option -g window-status-format         '#(TMUX_SHIP_TARGET="#{window_id}" tmuxship center)'
set-option -g window-status-current-format '#(TMUX_SHIP_TARGET="#{window_id}" tmuxship center)'

# Repaint on the events that change what the bar shows.
set-hook -g client-session-changed 'refresh-client -S'
set-hook -g client-attached        'refresh-client -S'
set-hook -g pane-focus-in          'refresh-client -S'

# Better window splitting shortcuts
bind-key - split-window -v -c '#{pane_current_path}'
bind-key \\ split-window -h -c '#{pane_current_path}'

# Fine adjustment (1 or 2 cursor cells per bump)
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

# Coarse adjustment (5 or 10 cursor cells per bump)
bind -n C-Left resize-pane -L 10
bind -n C-Right resize-pane -R 10
bind -n C-Down resize-pane -D 5
bind -n C-Up resize-pane -U 5

# Create new window with current path
bind c new-window -c "#{pane_current_path}"

# Better window numbering setup
set -g base-index 1
set -g renumber-windows on

# Break a pane out to new window while remaining on current
bind-key b break-pane -d

# Choose tree binding
bind-key C-j choose-tree
set -g mouse on

# Cycle through windows
bind-key -n F1 previous-window
bind-key -n F2 next-window

# Rearrange window order simply with left/right arrow
 bind-key S-Left swap-window -t -1
 bind-key S-Right swap-window -t +1

# List of plugins
set -g @tpm_plugins '                \
    tmux-plugins/tpm                 \
    tmux-plugins/tmux-sensible       \
    tmux-plugins/tmux-resurrect      \
    tmux-plugins/tmux-continuum      \
    tmux-plugins/tmux-yank           \
    tmux-plugins/tmux-pain-control   \
    tmux-plugins/tmux-copycat        \
    tmux-plugins/tmux-open           \
    tmux-plugins/tmux-battery        \
'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
